name: 🚀 Deploy Automático Sem Interrupções

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - vercel
          - cloudflare

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # CHECK E PREPARAÇÃO
  # ========================================
  prepare:
    name: 📋 Preparação
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_hash: ${{ steps.version.outputs.build_hash }}
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar versão
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
          BUILD_HASH=$(git rev-parse HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_hash=$BUILD_HASH" >> $GITHUB_OUTPUT
          echo "📦 Versão: $VERSION"

      - name: Verificar secrets
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] || [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets configurados"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⚠️ Secrets não configurados"
          fi

  # ========================================
  # BUILD
  # ========================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}
          VITE_BUILD_HASH: ${{ needs.prepare.outputs.build_hash }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}

      - name: Create version file
        run: |
          echo '{"version":"${{ needs.prepare.outputs.version }}","hash":"${{ needs.prepare.outputs.build_hash }}","date":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > dist/version.json

      - name: Cache busting
        run: |
          # Headers para Cloudflare
          cat > dist/_headers << 'EOF'
          /*
            X-Build-Version: ${{ needs.prepare.outputs.version }}
            X-Build-Hash: ${{ needs.prepare.outputs.build_hash }}
            Cache-Control: public, max-age=0, must-revalidate
            
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
            
          *.js
            Cache-Control: public, max-age=60, must-revalidate
            
          *.css
            Cache-Control: public, max-age=60, must-revalidate
          EOF
          
          # Não usar cache para HTML
          touch dist/.nojekyll
          
          echo "✅ Cache headers criados"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

  # ========================================
  # DEPLOY VERCEL
  # ========================================
  deploy-vercel:
    name: 🚀 Deploy Vercel
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_deploy == 'true'
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          working-directory: ./dist

      - name: Clear Vercel cache
        run: |
          curl -X POST "https://api.vercel.com/v6/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"target":"production"}' || true

      - name: Wait for propagation
        run: sleep 5

  # ========================================
  # DEPLOY CLOUDFLARE
  # ========================================
  deploy-cloudflare:
    name: ☁️ Deploy Cloudflare
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cinecasa --branch=main

      - name: Purge Cloudflare Cache
        run: |
          # Purge everything
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true
          
          echo "✅ Cloudflare cache purged"

      - name: Wait for propagation
        run: sleep 5

  # ========================================
  # NOTIFY
  # ========================================
  notify:
    name: 📢 Notificação
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy-cloudflare]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "🎉 Deploy concluído!"
          echo ""
          echo "📱 Acesse: https://cinecasa.vercel.app"
          echo "🌐 Mirror: https://cinecasa.paixaoflix.vip"
          echo ""
          echo "As atualizações estarão disponíveis automaticamente."
          echo "Os usuários verão as mudanças sem precisar fazer nada."

      - name: Trigger cache clear
        run: |
          # Ping para forçar atualização do service worker
          curl -s "https://cinecasa.vercel.app/version.json?v=${{ github.run_id }}" || true
          curl -s "https://cinecasa.paixaoflix.vip/version.json?v=${{ github.run_id }}" || true
          echo "✅ Cache ping enviado"

  # ========================================
  # DEPLOY WORKER
  # ========================================
  deploy-worker:
    name: 👷 Deploy Worker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker/worker.js --name cinecasa-worker
        continue-on-error: true

      - name: Clear Worker Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/workers/purge-cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" || true
          echo "✅ Worker cache cleared"

  # ========================================
  # CLEANUP
  # ========================================
  cleanup:
    name: 🧹 Limpeza
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy-cloudflare]
    if: always()
    steps:
      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: build-files
          failOnError: false

      - name: Summary
        run: |
          echo "🧹 Limpeza concluída"
          echo "Todos os caches foram limpos"
          echo "Deploy finalizado sem interrupções"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
