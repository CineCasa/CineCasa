# Cloudflare Workers Configuration
name = "cinecasa"
main = "./dist/index.html"
compatibility_date = "2024-01-01"

# Pages configuration
[site]
bucket = "./dist"

# Environment variables
[vars]
NODE_ENV = "production"

# Build configuration
[build]
command = "npm run build"

# Routes - SPA fallback
[[routes]]
pattern = "/*"
zone_name = "cinecasa.pages.dev"

# Headers for cache control
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
X-Build-Version = "${VITE_BUILD_VERSION}"
X-Build-Hash = "${VITE_BUILD_HASH}"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/cache-nuclear.js"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
Pragma = "no-cache"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
Pragma = "no-cache"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
Pragma = "no-cache"
