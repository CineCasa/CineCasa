<!DOCTYPE html><html lang="pt-BR"><head>  <meta charset="UTF-8"/>  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  <title>Detalhes</title>  <style>    body {      margin: 0;      background: #0b0b0f;      color: white;      font-family: Arial;    }    .backdrop {      height: 320px;      background-size: cover;      background-position: center;      position: relative;    }    .backdrop::after {      content: "";      position: absolute;      inset: 0;      background: linear-gradient(to bottom, rgba(0,0,0,0.2), #0b0b0f);    }    .top-buttons {      position: absolute;      top: 18px;      left: 18px;      right: 18px;      z-index: 5;      display: flex;      justify-content: space-between;      align-items: center;    }    .btn {      background: rgba(0,0,0,0.6);      backdrop-filter: blur(10px);      border: none;      color: white;      padding: 10px 14px;      border-radius: 12px;      cursor: pointer;      font-weight: bold;      outline: none;    }    .btn:focus {      box-shadow: 0 0 0 3px rgba(255,255,255,0.8);    }    .container {      padding: 20px;      display: flex;      gap: 18px;      margin-top: -90px;      position: relative;      z-index: 10;      flex-wrap: wrap;    }    .poster {      width: 170px;      border-radius: 16px;      box-shadow: 0 15px 60px rgba(0,0,0,0.8);    }    .info {      max-width: 900px;      flex: 1;      min-width: 260px;    }    .info h1 {      margin: 0;      font-size: 26px;    }    .meta {      margin-top: 8px;      opacity: 0.8;      font-size: 14px;    }    .overview {      margin-top: 14px;      font-size: 15px;      line-height: 1.4;      opacity: 0.9;    }    .actions {      margin-top: 18px;      display: flex;      gap: 12px;      flex-wrap: wrap;    }    .watch {
  background: #00d9ff !important;
  color: #000 !important;
  border: none;      background: #00d9ff !important;      color: black;      font-weight: bold;      padding: 12px 16px;      border-radius: 14px;      border: none;      cursor: pointer;      outline: none;    }    .watch:focus {      box-shadow: 0 0 0 3px rgba(255,255,255,0.8);    }    .icon-btn {      background: rgba(255,255,255,0.15);      border: 1px solid rgba(255,255,255,0.25);      backdrop-filter: blur(12px);      color: white;      padding: 12px 14px;      border-radius: 14px;      cursor: pointer;      font-weight: bold;      outline: none;    }    .icon-btn:focus {      box-shadow: 0 0 0 3px rgba(255,255,255,0.8);    }    .section {      padding: 20px;    }    .section h2 {      margin: 0 0 10px 0;      font-size: 18px;    }    .cast {      display: flex;      gap: 12px;      overflow-x: auto;      padding-bottom: 10px;    }    .cast::-webkit-scrollbar {      height: 8px;    }    .cast::-webkit-scrollbar-thumb {      background: rgba(255,255,255,0.15);      border-radius: 20px;    }    .actor {      width: 120px;      flex-shrink: 0;      text-align: center;      font-size: 12px;      opacity: 0.9;    }    .actor img {      width: 100%;      border-radius: 14px;      margin-bottom: 6px;    }  </style><script src="./update-detector.js?v=1"></script></head><body>  <div class="backdrop" id="backdrop">    <div class="top-buttons">      <button class="btn focusable" id="backBtn" tabindex="0">← Voltar</button>      <div style="display:flex; gap:10px;">        <button class="btn focusable" id="favBtn" tabindex="0">❤️</button>        <button class="btn focusable" id="laterBtn" tabindex="0">⏳</button>      </div>    </div>  </div>  <div class="container">    <img class="poster" id="poster" src="" alt="poster">    <div class="info">      <h1 id="title"></h1>      <div class="meta" id="meta"></div>      <p class="overview" id="overview"></p>      <div class="actions">        <button class="watch focusable" id="watchBtn" tabindex="0">▶ Assistir</button>        <button class="icon-btn focusable" id="trailerBtn" tabindex="0">🎬 Trailer</button>      </div>    </div>  </div>  <div class="section">    <h2>Elenco</h2>    <div class="cast" id="cast"></div>  </div>  <script>    // TROCAR PARA SUA URL DO WORKER SE NECESSÁRIO    const API_BASE = "https://SEU-WORKER.workers.dev";    const params = new URLSearchParams(window.location.search);    const tmdbId = params.get("tmdb");    const favBtn = document.getElementById("favBtn");    const laterBtn = document.getElementById("laterBtn");    const watchBtn = document.getElementById("watchBtn");    const trailerBtn = document.getElementById("trailerBtn");    const backBtn = document.getElementById("backBtn");    backBtn.addEventListener("click", () => history.back());    watchBtn.addEventListener("click", () => {      window.location.href = `./watch.html?tmdb=${tmdbId}`;    });    trailerBtn.addEventListener("click", () => {      alert("Trailer disponível no catálogo (modo TikTok).");    });    favBtn.addEventListener("click", async () => {      await fetch(`${API_BASE}/list/favorite`, {        method: "POST",        headers: {"Content-Type": "application/json"},        body: JSON.stringify({ tmdb_id: tmdbId })      });      alert("Adicionado aos favoritos!");    });    laterBtn.addEventListener("click", async () => {      await fetch(`${API_BASE}/list/watchlater`, {        method: "POST",        headers: {"Content-Type": "application/json"},        body: JSON.stringify({ tmdb_id: tmdbId })      });      alert("Adicionado em ver depois!");    });    async function loadDetails() {      const res = await fetch(`${API_BASE}/tmdb/details?tmdb=${tmdbId}`);      const data = await res.json();      document.getElementById("title").textContent = data.title;      document.getElementById("overview").textContent = data.overview;      document.getElementById("poster").src = data.poster;      document.getElementById("backdrop").style.backgroundImage = `url(${data.backdrop})`;      document.getElementById("meta").textContent =        `${data.year} • ${data.genres.join(", ")} • ⭐ ${data.vote}`;      const castDiv = document.getElementById("cast");      castDiv.innerHTML = "";      data.cast.forEach(actor => {        const div = document.createElement("div");        div.className = "actor";        div.innerHTML = `          <img src="${actor.photo}" alt="">          <div>${actor.name}</div>        `;        castDiv.appendChild(div);      });    }    // NAVIGAÇÃO CONTROLE REMOTO BÁSICA    document.addEventListener("keydown", (e) => {      if (e.key === "Enter") {        if (document.activeElement) {          document.activeElement.click();        }      }    });    loadDetails();  </script></body></html>
