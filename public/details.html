<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineCasa - Detalhes</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --cine-blue: #00d9ff; --cine-blue-glow: rgba(0,217,255,0.6); --cine-dark: #050a12; --cine-darker: #020408; }
    body { font-family: 'Montserrat', sans-serif; background: var(--cine-darker); color: white; overflow-x: hidden; }
    .hero { position: relative; width: 100%; height: 70vh; min-height: 500px; max-height: 800px; background-size: cover; background-position: center top; }
    .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5,10,18,0.3) 0%, rgba(5,10,18,0.6) 50%, var(--cine-darker) 100%); }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: linear-gradient(to bottom, rgba(5,10,18,0.9), transparent); }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.5rem; color: var(--cine-blue); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 20px var(--cine-blue-glow); }
    .back-btn { background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.75rem 1.25rem; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; outline: none; }
    .back-btn:hover, .back-btn.focused { border-color: var(--cine-blue); box-shadow: 0 0 20px var(--cine-blue-glow); transform: scale(1.05); }
    .content-wrapper { position: relative; z-index: 10; margin-top: -150px; padding: 0 4% 4rem; }
    .main-grid { display: grid; grid-template-columns: 300px 1fr 350px; gap: 2.5rem; align-items: start; }
    .poster-section { position: sticky; top: 100px; }
    .poster { width: 100%; border-radius: 20px; box-shadow: 0 25px 80px rgba(0,0,0,0.8), 0 0 40px rgba(0,217,255,0.1); transition: transform 0.3s ease; }
    .movie-info { padding-top: 2rem; }
    .badge { display: inline-block; background: var(--cine-blue); color: black; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; }
    h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 1rem; text-shadow: 0 4px 30px rgba(0,0,0,0.8); }
    .meta-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; font-size: 0.95rem; }
    .rating { display: flex; align-items: center; gap: 0.4rem; background: rgba(255,193,7,0.2); color: #ffc107; padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 700; }
    .genre-tag { background: rgba(0,217,255,0.15); color: var(--cine-blue); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(0,217,255,0.3); }
    .age-badge { background: rgba(220,53,69,0.8); color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 700; }
    .main-actions { display: flex; gap: 1rem; margin: 2rem 0; flex-wrap: wrap; }
    .btn-primary { display: flex; align-items: center; gap: 0.75rem; background: var(--cine-blue); color: black; border: none; padding: 1rem 2rem; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; outline: none; }
    .btn-primary:hover, .btn-primary.focused { transform: scale(1.05); box-shadow: 0 0 30px var(--cine-blue-glow); }
    .btn-secondary { display: flex; align-items: center; gap: 0.75rem; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 1rem 2rem; border-radius: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; outline: none; }
    .btn-secondary:hover, .btn-secondary.focused { border-color: var(--cine-blue); background: rgba(0,217,255,0.15); box-shadow: 0 0 20px var(--cine-blue-glow); transform: scale(1.05); }
    .icon-actions { display: flex; gap: 0.75rem; margin-bottom: 2rem; }
    .icon-btn { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.3rem; transition: all 0.3s ease; outline: none; }
    .icon-btn:hover, .icon-btn.focused { border-color: var(--cine-blue); background: rgba(0,217,255,0.15); box-shadow: 0 0 25px var(--cine-blue-glow); transform: scale(1.1); }
    .synopsis { font-size: 1.05rem; line-height: 1.8; color: rgba(255,255,255,0.85); max-width: 700px; margin-bottom: 1rem; }
    .synopsis.clamped { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .show-more { color: var(--cine-blue); cursor: pointer; font-weight: 600; font-size: 0.95rem; background: none; border: none; padding: 0; outline: none; }
    .details-panel { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 1.5rem; position: sticky; top: 100px; }
    .details-panel h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--cine-blue); text-transform: uppercase; letter-spacing: 1px; }
    .detail-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.9rem; }
    .section-title { font-size: 1.5rem; font-weight: 700; margin: 3rem 0 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
    .cast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1.5rem; }
    .cast-member { text-align: center; cursor: pointer; transition: transform 0.3s ease; outline: none; }
    .cast-member:hover, .cast-member.focused { transform: translateY(-5px); }
    .cast-img { width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); margin-bottom: 0.75rem; transition: all 0.3s ease; }
    .cast-name { font-size: 0.85rem; font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recommendations { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); }
    .rec-grid { display: flex; gap: 1.25rem; overflow-x: auto; padding-bottom: 1rem; }
    .rec-card { flex: 0 0 160px; cursor: pointer; transition: transform 0.3s ease; outline: none; }
    .rec-card:hover, .rec-card.focused { transform: scale(1.08); }
    .rec-poster { width: 100%; aspect-ratio: 2/3; border-radius: 12px; object-fit: cover; border: 2px solid transparent; transition: all 0.3s ease; background: rgba(255,255,255,0.05); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .modal-overlay.active { display: flex; }
    .modal-content { width: 90%; max-width: 1000px; aspect-ratio: 16/9; position: relative; }
    .modal-close { position: absolute; top: -50px; right: 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.75rem 1.5rem; border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; outline: none; }
    .loading { position: fixed; inset: 0; background: var(--cine-darker); display: flex; align-items: center; justify-content: center; z-index: 3000; }
    .loading-spinner { width: 60px; height: 60px; border: 3px solid rgba(0,217,255,0.2); border-top-color: var(--cine-blue); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1200px) { .main-grid { grid-template-columns: 250px 1fr; } .details-panel { display: none; } h1 { font-size: 2.5rem; } }
    @media (max-width: 768px) { .hero { height: 50vh; min-height: 350px; } .content-wrapper { margin-top: -80px; padding: 0 1rem 2rem; } .main-grid { grid-template-columns: 1fr; } .poster-section { position: relative; top: 0; width: 200px; margin: 0 auto; } h1 { font-size: 1.75rem; } .main-actions { flex-direction: column; } .btn-primary, .btn-secondary { width: 100%; justify-content: center; } .cast-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); } .rec-card { flex: 0 0 130px; } }
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="loading-spinner"></div></div>
  <div class="modal-overlay" id="trailerModal">
    <div class="modal-content">
      <button class="modal-close focusable" id="closeModal">✕ FECHAR</button>
      <iframe class="modal-iframe" id="trailerFrame" allowfullscreen></iframe>
    </div>
  </div>
  
  <nav class="navbar">
    <div class="logo">◉ CINECASA</div>
    <button class="back-btn focusable" id="backBtn" tabindex="0">← VOLTAR</button>
  </nav>
  
  <div class="hero" id="hero"></div>
  
  <div class="content-wrapper">
    <div class="main-grid">
      <div class="poster-section">
        <img class="poster" id="poster" src="" alt="Poster">
      </div>
      
      <div class="movie-info">
        <span class="badge" id="typeBadge">FILME</span>
        <h1 id="title">Carregando...</h1>
        
        <div class="meta-row">
          <div class="rating"><span>★</span><span id="rating">0.0</span></div>
          <span id="year">2024</span>
          <span id="duration">-- min</span>
          <span class="age-badge" id="ageBadge">L</span>
          <img id="countryFlag" class="country-flag" src="" alt="" style="width:28px;height:20px;display:none;">
        </div>
        
        <div id="genres" style="display:flex;gap:0.6rem;flex-wrap:wrap;margin-bottom:2rem;"></div>
        
        <div class="main-actions">
          <button class="btn-primary focusable" id="watchBtn" tabindex="0">
            <span>▶</span> ASSISTIR AGORA
          </button>
          <button class="btn-secondary focusable" id="trailerBtn" tabindex="0">
            <span>🎬</span> TRAILER
          </button>
        </div>
        
        <div class="icon-actions">
          <button class="icon-btn focusable" id="favBtn" title="Favoritos" tabindex="0">❤️</button>
          <button class="icon-btn focusable" id="laterBtn" title="Assistir depois" tabindex="0">⏳</button>
          <button class="icon-btn focusable" id="likeBtn" title="Gostei" tabindex="0">👍</button>
          <button class="icon-btn focusable" id="dislikeBtn" title="Não gostei" tabindex="0">👎</button>
        </div>
        
        <p class="synopsis clamped" id="synopsis"></p>
        <button class="show-more focusable" id="showMore" tabindex="0">VER MAIS</button>
        
        <h2 class="section-title">ELENCO PRINCIPAL</h2>
        <div class="cast-grid" id="castGrid"></div>
        
        <div class="recommendations" id="recSection" style="display:none;">
          <h2 class="section-title" id="recTitle">CONTINUAÇÕES</h2>
          <div class="rec-grid" id="recGrid"></div>
        </div>
      </div>
      
      <div class="details-panel">
        <h3>📋 DETALHES</h3>
        <div class="detail-row">
          <span class="detail-label">🎬 Direção</span>
          <span class="detail-value" id="director">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">✍️ Roteiro</span>
          <span class="detail-value" id="writers">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">🏢 Produção</span>
          <span class="detail-value" id="production">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">🎪 Estúdio</span>
          <span class="detail-value" id="studio">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">📦 Distribuição</span>
          <span class="detail-value" id="distribution">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">🗣️ Idiomas</span>
          <span class="detail-value" id="languages">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">💬 Legendas</span>
          <span class="detail-value">Português</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">🎥 Qualidade</span>
          <span class="detail-value">4K UHD • HDR10</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">📅 Lançamento</span>
          <span class="detail-value" id="releaseDate">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">💰 Orçamento</span>
          <span class="detail-value" id="budget">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">💵 Receita</span>
          <span class="detail-value" id="revenue">-</span>
        </div>
      </div>
    </div>
  </div>

<script>
const WORKER_URL = 'https://cinecasa-worker.cinecasa-worker.workers.dev';
const TMDB_IMAGE_URL = 'https://image.tmdb.org/t/p';
const SUPABASE_URL = 'https://eqhstnlsmfrwxhvcwoid.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxaHN0bmxzbWZyd3hodmN3b2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MTg1NTcsImV4cCI6MjA4ODI5NDU1N30.6AmJi7zs-1QDnStIIN5bJGoFFhv4WveC1NUAHKI0Qlo';
let movieData = null;
let focusableElements = [];
let currentFocusIndex = 0;

const urlParams = new URLSearchParams(window.location.search);
const tmdbId = urlParams.get('tmdb');
const type = urlParams.get('type') || 'movie';

const countryCodes = {
  'United States': 'us', 'USA': 'us', 'Estados Unidos': 'us',
  'Brazil': 'br', 'Brasil': 'br', 'France': 'fr', 'França': 'fr',
  'United Kingdom': 'gb', 'UK': 'gb', 'Reino Unido': 'gb',
  'Germany': 'de', 'Alemanha': 'de', 'Japan': 'jp', 'Japão': 'jp',
  'South Korea': 'kr', 'Coreia do Sul': 'kr', 'India': 'in', 'Índia': 'in',
  'Italy': 'it', 'Itália': 'it', 'Spain': 'es', 'Espanha': 'es',
  'Mexico': 'mx', 'México': 'mx', 'Canada': 'ca', 'Canadá': 'ca',
  'Australia': 'au', 'Austrália': 'au', 'Argentina': 'ar', 'China': 'cn',
  'Russia': 'ru', 'Rússia': 'ru'
};

document.addEventListener('DOMContentLoaded', () => {
  if (!tmdbId) { alert('ID do filme não encontrado'); window.history.back(); return; }
  loadMovieData();
  setupNavigation();
});

async function loadMovieData() {
  try {
    const response = await fetch(`${WORKER_URL}/tmdb/details?tmdb=${tmdbId}&type=${type}`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    
    if (!response.ok) throw new Error('Failed to fetch movie data');
    movieData = await response.json();
    
    // Buscar trailer da tabela cinema
    const cinemaTrailer = await fetchCinemaTrailer(tmdbId);
    if (cinemaTrailer) {
      movieData.cinemaTrailer = cinemaTrailer;
    }
    
    renderMovieData();
    
    if (movieData.belongs_to_collection) { 
      loadCollection(movieData.belongs_to_collection.id); 
    } else { 
      loadRecommendations(); 
    }
    
    document.getElementById('loading').style.display = 'none';
    updateFocusableElements();
  } catch (error) {
    console.error('Error loading movie:', error);
    alert('Erro ao carregar dados do filme');
    document.getElementById('loading').style.display = 'none';
  }
}

async function fetchCinemaTrailer(tmdbId) {
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/cinema?select=trailer&tmdb_id=eq.${tmdbId}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!response.ok) return null;
    const data = await response.json();
    return data && data[0] && data[0].trailer ? data[0].trailer : null;
  } catch (error) {
    console.error('Error fetching cinema trailer:', error);
    return null;
  }
}

function renderMovieData() {
  const isTV = type === 'tv';
  const hero = document.getElementById('hero');
  
  if (movieData.backdrop_path) { 
    hero.style.backgroundImage = `url(${TMDB_IMAGE_URL}/original${movieData.backdrop_path})`; 
  }
  
  document.getElementById('typeBadge').textContent = isTV ? 'SÉRIE' : 'FILME';
  document.getElementById('title').textContent = movieData.title || 'Sem título';
  
  const poster = document.getElementById('poster');
  if (movieData.poster_path) { 
    poster.src = `${TMDB_IMAGE_URL}/w500${movieData.poster_path}`; 
  } else { 
    poster.style.display = 'none'; 
  }
  
  document.getElementById('rating').textContent = movieData.vote_average ? movieData.vote_average.toFixed(1) : '0.0';
  const date = movieData.release_date;
  document.getElementById('year').textContent = date ? date.split('-')[0] : '-';
  document.getElementById('duration').textContent = movieData.runtime ? `${movieData.runtime} min` : '-';
  document.getElementById('ageBadge').textContent = movieData.age_rating || 'L';
  
  const country = movieData.production_countries && movieData.production_countries[0];
  if (country) {
    const flag = document.getElementById('countryFlag');
    const code = countryCodes[country.name] || country.iso_3166_1.toLowerCase();
    flag.src = `https://flagcdn.com/w40/${code}.png`;
    flag.style.display = 'inline-block';
    flag.alt = country.name;
  }
  
  const genresContainer = document.getElementById('genres');
  if (movieData.genres) {
    genresContainer.innerHTML = movieData.genres.map(g => `<span class="genre-tag">${g.name}</span>`).join('');
  }
  
  document.getElementById('synopsis').textContent = movieData.overview || 'Sinopse não disponível';
  
  const castGrid = document.getElementById('castGrid');
  if (movieData.cast) {
    castGrid.innerHTML = movieData.cast.map((actor, i) => `
      <div class="cast-member focusable" tabindex="0" data-index="${i}">
        <img class="cast-img" src="${actor.profile_path ? TMDB_IMAGE_URL + '/w185' + actor.profile_path : 'https://via.placeholder.com/120x120/1a1a2e/00d9ff?text=?' }" alt="${actor.name}">
        <div class="cast-name">${actor.name}</div>
        <div class="cast-character">${actor.character}</div>
      </div>
    `).join('');
  }
  
  document.getElementById('director').textContent = movieData.directors ? movieData.directors.join(', ') : '-';
  document.getElementById('writers').textContent = movieData.writers ? movieData.writers.join(', ') : '-';
  const production = movieData.production_companies && movieData.production_companies[0] ? movieData.production_companies[0].name : '-';
  const studio = movieData.production_companies ? movieData.production_companies.map(p => p.name).join(', ') : '-';
  document.getElementById('production').textContent = production;
  document.getElementById('studio').textContent = studio;
  document.getElementById('distribution').textContent = production;
  document.getElementById('languages').textContent = movieData.spoken_languages ? movieData.spoken_languages.map(l => l.name).join(', ') : '-';
  document.getElementById('releaseDate').textContent = date ? new Date(date).toLocaleDateString('pt-BR') : '-';
  document.getElementById('budget').textContent = movieData.budget ? 'US$ ' + (movieData.budget / 1000000).toFixed(1) + 'M' : '-';
  document.getElementById('revenue').textContent = movieData.revenue ? 'US$ ' + (movieData.revenue / 1000000).toFixed(1) + 'M' : '-';
  
  document.getElementById('watchBtn').onclick = () => { 
    // Redireciona para o player do React
    window.location.href = `/?watch=${tmdbId}&type=${type}`;
  };
  
  const trailerBtn = document.getElementById('trailerBtn');
  const trailerKey = movieData.cinemaTrailer || (movieData.trailer ? movieData.trailer.key : null);
  if (trailerKey) { 
    trailerBtn.onclick = () => openTrailer(trailerKey); 
  } else { 
    trailerBtn.style.opacity = '0.5'; 
    trailerBtn.onclick = () => alert('Trailer não disponível'); 
  }
  
  document.getElementById('backBtn').onclick = () => {
    // Se vier da página /filmes, volta para /filmes
    if (document.referrer.includes('/filmes') || window.location.href.includes('from=filmes')) {
      window.location.href = '/filmes';
    } else {
      window.history.back();
    }
  };
  
  const synopsis = document.getElementById('synopsis');
  const showMore = document.getElementById('showMore');
  showMore.onclick = () => { 
    synopsis.classList.toggle('clamped'); 
    showMore.textContent = synopsis.classList.contains('clamped') ? 'VER MAIS' : 'VER MENOS'; 
  };
  
  setupIconButtons();
}

function openTrailer(key) {
  const modal = document.getElementById('trailerModal');
  const frame = document.getElementById('trailerFrame');
  frame.src = `https://www.youtube.com/embed/${key}?autoplay=1`;
  modal.classList.add('active');
  document.getElementById('closeModal').onclick = closeTrailer;
}

function closeTrailer() {
  const modal = document.getElementById('trailerModal');
  const frame = document.getElementById('trailerFrame');
  frame.src = '';
  modal.classList.remove('active');
}

async function loadCollection(collectionId) {
  try {
    const response = await fetch(`${WORKER_URL}/tmdb/collection?collection=${collectionId}`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    
    if (!response.ok) return;
    const collection = await response.json();
    const otherMovies = collection.parts.filter(m => m.id !== parseInt(tmdbId));
    
    if (otherMovies.length > 0) {
      document.getElementById('recTitle').textContent = '🎬 CONTINUAÇÕES';
      document.getElementById('recSection').style.display = 'block';
      renderRecommendations(otherMovies.slice(0, 6));
    } else { 
      loadRecommendations(); 
    }
  } catch (error) { 
    loadRecommendations(); 
  }
}

async function loadRecommendations() {
  try {
    const response = await fetch(`${WORKER_URL}/tmdb/recommendations?tmdb=${tmdbId}&type=${type}`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    
    if (!response.ok) return;
    const data = await response.json();
    
    if (data.results && data.results.length > 0) {
      document.getElementById('recTitle').textContent = '💡 SUGESTÕES PARA VOCÊ';
      document.getElementById('recSection').style.display = 'block';
      renderRecommendations(data.results.slice(0, 6));
    }
  } catch (error) { 
    console.error('Error loading recommendations:', error); 
  }
}

function renderRecommendations(movies) {
  const grid = document.getElementById('recGrid');
  grid.innerHTML = movies.map(m => `
    <div class="rec-card focusable" tabindex="0" onclick="window.location.href='details.html?tmdb=${m.id}&type=${m.type}'">
      <img class="rec-poster" src="${m.poster_path ? TMDB_IMAGE_URL + '/w342' + m.poster_path : 'https://via.placeholder.com/180x270/1a1a2e/00d9ff?text=?' }" alt="${m.title}">
      <div class="rec-title">${m.title}</div>
      <div class="rec-year">${(m.release_date || '').split('-')[0]}</div>
    </div>
  `).join('');
  updateFocusableElements();
}

function setupIconButtons() {
  const buttons = ['favBtn', 'laterBtn', 'likeBtn', 'dislikeBtn'];
  buttons.forEach(id => {
    const btn = document.getElementById(id);
    btn.onclick = async () => {
      btn.classList.toggle('active');
      const endpoint = id === 'favBtn' ? '/list/favorite' : id === 'laterBtn' ? '/list/watchlater' : id === 'likeBtn' ? '/list/like' : '/list/dislike';
      
      try {
        const response = await fetch(`${WORKER_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tmdb_id: tmdbId, type: type })
        });
        console.log(`POST ${endpoint}`, await response.json());
      } catch (error) {
        console.error('Error:', error);
      }
    };
  });
}

function setupNavigation() {
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('trailerModal').classList.contains('active')) {
      if (e.key === 'Escape') closeTrailer();
      return;
    }
    
    switch(e.key) {
      case 'ArrowRight': navigateFocus(1); break;
      case 'ArrowLeft': navigateFocus(-1); break;
      case 'ArrowDown': navigateSection(1); break;
      case 'ArrowUp': navigateSection(-1); break;
      case 'Enter': 
      case ' ': activateFocused(); 
        e.preventDefault(); 
        break;
      case 'Escape': window.history.back(); break;
    }
  });
}

function updateFocusableElements() {
  focusableElements = Array.from(document.querySelectorAll('.focusable'));
  if (focusableElements.length > 0) { 
    focusableElements[0].focus();
    focusableElements[0].classList.add('focused'); 
  }
}

function navigateFocus(direction) {
  if (focusableElements.length === 0) return;
  focusableElements[currentFocusIndex].classList.remove('focused');
  currentFocusIndex = (currentFocusIndex + direction + focusableElements.length) % focusableElements.length;
  focusableElements[currentFocusIndex].classList.add('focused');
  focusableElements[currentFocusIndex].focus();
  focusableElements[currentFocusIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function navigateSection(direction) {
  const sections = document.querySelectorAll('.section-title');
  const currentSection = getCurrentSection();
  const newIndex = currentSection + direction;
  
  if (newIndex >= 0 && newIndex < sections.length) {
    sections[newIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function getCurrentSection() {
  const sections = document.querySelectorAll('.section-title');
  for (let i = 0; i < sections.length; i++) {
    const rect = sections[i].getBoundingClientRect();
    if (rect.top >= 0 && rect.top < window.innerHeight / 2) {
      return i;
    }
  }
  return 0;
}

function activateFocused() {
  if (focusableElements[currentFocusIndex]) { 
    focusableElements[currentFocusIndex].click(); 
  }
}
</script>
