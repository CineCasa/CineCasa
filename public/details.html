<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0b0b0f"/>
  <title>Detalhes</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Responsive Backdrop */
    .backdrop {
      height: 280px;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    
    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), #0b0b0f);
    }
    
    /* Top Buttons - Responsive */
    .top-buttons {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .btn {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      outline: none;
      font-size: 14px;
      min-height: 44px;
      touch-action: manipulation;
    }
    
    .btn:focus {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.8);
    }
    
    /* Container - Mobile First */
    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: -70px;
      position: relative;
      z-index: 10;
    }
    
    .poster {
      width: 150px;
      border-radius: 16px;
      box-shadow: 0 15px 60px rgba(0,0,0,0.8);
      align-self: center;
    }
    
    .info {
      flex: 1;
      min-width: 0;
    }
    
    .info h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      word-wrap: break-word;
    }
    
    .meta {
      margin-top: 8px;
      opacity: 0.8;
      font-size: 13px;
      word-wrap: break-word;
    }
    
    .overview {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.9;
    }
    
    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .watch {
      background: white;
      color: black;
      font-weight: bold;
      padding: 12px 18px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      outline: none;
      font-size: 14px;
      min-height: 44px;
      touch-action: manipulation;
      flex: 1;
      min-width: 140px;
    }
    
    .watch:focus {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.8);
    }
    
    .icon-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
      outline: none;
      font-size: 14px;
      min-height: 44px;
      touch-action: manipulation;
      min-width: 44px;
    }
    
    .icon-btn:focus {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.8);
    }
    
    .section {
      padding: 16px;
    }
    
    .section h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }
    
    .cast {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    
    .cast::-webkit-scrollbar {
      height: 6px;
    }
    
    .cast::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
    }
    
    .actor {
      width: 100px;
      flex-shrink: 0;
      text-align: center;
      font-size: 11px;
      opacity: 0.9;
      scroll-snap-align: start;
    }
    
    .actor img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 6px;
      aspect-ratio: 2/3;
      object-fit: cover;
    }
    
    /* Loading state */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      color: #888;
    }
    
    /* Error state */
    .error {
      text-align: center;
      padding: 40px 20px;
      color: #ff6b6b;
    }
    
    /* ============================================
       TABLET BREAKPOINT
       ============================================ */
    @media (min-width: 600px) {
      .backdrop {
        height: 350px;
      }
      
      .top-buttons {
        top: 18px;
        left: 18px;
        right: 18px;
      }
      
      .btn {
        padding: 12px 16px;
        font-size: 15px;
      }
      
      .container {
        padding: 20px;
        flex-direction: row;
        align-items: flex-start;
        gap: 20px;
        margin-top: -80px;
      }
      
      .poster {
        width: 180px;
        align-self: flex-start;
      }
      
      .info h1 {
        font-size: 28px;
      }
      
      .meta {
        font-size: 14px;
      }
      
      .overview {
        font-size: 15px;
      }
      
      .section {
        padding: 20px;
      }
      
      .section h2 {
        font-size: 18px;
      }
      
      .actor {
        width: 120px;
        font-size: 12px;
      }
    }
    
    /* ============================================
       DESKTOP BREAKPOINT
       ============================================ */
    @media (min-width: 1024px) {
      .backdrop {
        height: 400px;
      }
      
      .container {
        padding: 24px;
        gap: 24px;
        margin-top: -100px;
      }
      
      .poster {
        width: 200px;
      }
      
      .info h1 {
        font-size: 32px;
      }
      
      .meta {
        font-size: 15px;
      }
      
      .overview {
        font-size: 16px;
        max-width: 700px;
      }
      
      .section {
        padding: 24px;
      }
    }
    
    /* ============================================
       LANDSCAPE MOBILE
       ============================================ */
    @media (max-height: 500px) and (orientation: landscape) {
      .backdrop {
        height: 180px;
      }
      
      .container {
        flex-direction: row;
        margin-top: -40px;
      }
      
      .poster {
        width: 120px;
      }
      
      .info h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop">
    <div class="top-buttons">
      <button class="btn focusable" id="backBtn" tabindex="0">← Voltar</button>
      <div style="display:flex; gap:10px;">
        <button class="btn focusable" id="favBtn" tabindex="0" aria-label="Adicionar aos favoritos">❤️</button>
        <button class="btn focusable" id="laterBtn" tabindex="0" aria-label="Ver depois">⏳</button>
      </div>
    </div>
  </div>
  
  <div class="container">
    <img class="poster" id="poster" src="" alt="poster" loading="lazy">
    <div class="info">
      <h1 id="title">Carregando...</h1>
      <div class="meta" id="meta"></div>
      <p class="overview" id="overview"></p>
      <div class="actions">
        <button class="watch focusable" id="watchBtn" tabindex="0">▶ Assistir</button>
        <button class="icon-btn focusable" id="trailerBtn" tabindex="0" aria-label="Ver trailer">🎬 Trailer</button>
      </div>
    </div>
  </div>
  
  <div class="section">
    <h2>Elenco</h2>
    <div class="cast" id="cast"></div>
  </div>

  <script>
    // API Configuration
    const API_BASE = "https://SEU-WORKER.workers.dev";
    const params = new URLSearchParams(window.location.search);
    const tmdbId = params.get("tmdb");
    
    // Elements
    const favBtn = document.getElementById("favBtn");
    const laterBtn = document.getElementById("laterBtn");
    const watchBtn = document.getElementById("watchBtn");
    const trailerBtn = document.getElementById("trailerBtn");
    const backBtn = document.getElementById("backBtn");
    
    // Event Listeners
    backBtn.addEventListener("click", () => history.back());
    
    watchBtn.addEventListener("click", () => {
      if (tmdbId) {
        window.location.href = `./watch.html?tmdb=${tmdbId}`;
      }
    });
    
    trailerBtn.addEventListener("click", () => {
      alert("Trailer disponível no catálogo (modo TikTok).");
    });
    
    favBtn.addEventListener("click", async () => {
      try {
        await fetch(`${API_BASE}/list/favorite`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ tmdb_id: tmdbId })
        });
        alert("Adicionado aos favoritos!");
      } catch (err) {
        alert("Erro ao adicionar favorito.");
      }
    });
    
    laterBtn.addEventListener("click", async () => {
      try {
        await fetch(`${API_BASE}/list/watchlater`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ tmdb_id: tmdbId })
        });
        alert("Adicionado em ver depois!");
      } catch (err) {
        alert("Erro ao adicionar.");
      }
    });
    
    // Load Details
    async function loadDetails() {
      if (!tmdbId) {
        document.getElementById("title").textContent = "ID não fornecido";
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/tmdb/details?tmdb=${tmdbId}`);
        if (!res.ok) throw new Error("Failed to load");
        
        const data = await res.json();
        
        document.getElementById("title").textContent = data.title || "Título não disponível";
        document.getElementById("overview").textContent = data.overview || "Sem descrição disponível.";
        
        if (data.poster) {
          document.getElementById("poster").src = data.poster;
        }
        
        if (data.backdrop) {
          document.getElementById("backdrop").style.backgroundImage = `url(${data.backdrop})`;
        }
        
        document.getElementById("meta").textContent = 
          `${data.year || ''} • ${(data.genres || []).join(", ")} • ⭐ ${data.vote || ''}`;
        
        // Cast
        const castDiv = document.getElementById("cast");
        castDiv.innerHTML = "";
        
        if (data.cast && data.cast.length > 0) {
          data.cast.forEach(actor => {
            const div = document.createElement("div");
            div.className = "actor";
            div.innerHTML = `
              <img src="${actor.photo || ''}" alt="${actor.name}" loading="lazy">
              <div>${actor.name}</div>
            `;
            castDiv.appendChild(div);
          });
        } else {
          castDiv.innerHTML = "<p style='opacity: 0.6;'>Elenco não disponível</p>";
        }
        
      } catch (error) {
        console.error(error);
        document.getElementById("title").textContent = "Erro ao carregar";
        document.querySelector(".container").innerHTML += `
          <div class="error">
            <p>Não foi possível carregar os detalhes.</p>
            <button onclick="location.reload()" class="btn" style="margin-top: 20px;">Tentar novamente</button>
          </div>
        `;
      }
    }
    
    // Keyboard Navigation
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && document.activeElement) {
        document.activeElement.click();
      }
    });
    
    // Initialize
    loadDetails();
  </script>
</body>
</html>
