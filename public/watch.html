<!DOCTYPE html><html lang="pt-BR"><head>  <meta charset="UTF-8"/>  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  <title>Assistir</title>  <link href="https://vjs.zencdn.net/8.12.0/video-js.css" rel="stylesheet"/>  <style>    body {      margin: 0;      background: black;      color: white;      font-family: Arial;    }    .topbar {      position: fixed;      top: 0;      left: 0;      right: 0;      z-index: 9999;      display: flex;      gap: 10px;      align-items: center;      padding: 12px 14px;      background: rgba(0,0,0,0.6);      backdrop-filter: blur(12px);    }    .topbar button {      border: none;      border-radius: 12px;      padding: 10px 14px;      cursor: pointer;      background: rgba(255,255,255,0.15);      color: white;      font-weight: bold;      outline: none;    }    .topbar button:focus {      box-shadow: 0 0 0 3px rgba(255,255,255,0.8);    }    .player-container {      position: fixed;      inset: 0;      padding-top: 55px;    }    .video-js {      width: 100%;      height: 100%;    }  </style></head><body>  <div class="topbar">    <button id="backBtn" tabindex="0">← Voltar</button>    <span id="movieTitle" style="font-weight:bold;"></span>  </div>  <div class="player-container">    <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto"></video>  </div>  <script src="https://vjs.zencdn.net/8.12.0/video.min.js"></script>  <script src="https://cdn.jsdelivr.net/npm/videojs-hotkeys@0.2.27/videojs.hotkeys.min.js"></script>  <script>    // TROCAR PARA SUA URL DO WORKER SE NECESSÁRIO    const API_BASE = "https://SEU-WORKER.workers.dev";    const params = new URLSearchParams(window.location.search);    const tmdbId = params.get("tmdb");    document.getElementById("backBtn").addEventListener("click", () => history.back());    const player = videojs("my-video", {      autoplay: true,      controls: true,      fluid: true,      responsive: true,      playbackRates: [0.5, 1, 1.25, 1.5, 2]    });    player.ready(function() {      this.hotkeys({        volumeStep: 0.1,        seekStep: 10,        enableModifiersForNumbers: false      });    });    async function loadMovie() {      const res = await fetch(`${API_BASE}/movie?tmdb=${tmdbId}`);      const data = await res.json();      document.getElementById("movieTitle").textContent = data.titulo || "";      const movieUrl = data.url;      if (!movieUrl) {        alert("URL do filme não encontrada.");        return;      }      if (movieUrl.endsWith(".m3u8")) {        player.src({          src: movieUrl,          type: "application/x-mpegURL"        });      } else {        player.src({          src: movieUrl,          type: "video/mp4"        });      }      player.play();    }    // CONTROLE REMOTO NO PLAYER    document.addEventListener("keydown", (e) => {      if (e.key === "Enter") {        if (player.paused()) player.play();        else player.pause();      }      if (e.key === "ArrowRight") {        player.currentTime(player.currentTime() + 10);      }      if (e.key === "ArrowLeft") {        player.currentTime(player.currentTime() - 10);      }      if (e.key === "ArrowUp") {        player.volume(Math.min(1, player.volume() + 0.1));      }      if (e.key === "ArrowDown") {        player.volume(Math.max(0, player.volume() - 0.1));      }    });    loadMovie();  </script></body></html>
