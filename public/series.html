<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineCasa - Séries</title>
  <link rel="stylesheet" href="./assets/app.css">
  <script src="./update-detector.js?v=1"></script>
</head>
<body>
  <header class="top-header">
    <nav class="nav-menu">
      <a href="./index.html" class="nav-logo">CineCasa</a>
      <div class="nav-links">
        <a href="./index.html" class="nav-link">Início</a>
        <a href="./filmes.html" class="nav-link">Filmes</a>
        <a href="./series.html" class="nav-link active">Séries</a>
      </div>
    </nav>
  </header>

  <!-- HERO BANNER -->
  <section class="hero-banner" id="heroBanner">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h2 class="hero-title" id="heroTitle"></h2>
      <div class="hero-meta">
        <img id="heroFlag" src="" alt="flag">
        <span id="heroYear"></span>
        <span id="heroGenre"></span>
        <span id="heroRating"></span>
      </div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-actions">
        <button class="hero-watch-btn focusable" id="heroWatchBtn" tabindex="0">▶ Assistir agora</button>
        <button class="hero-list-btn focusable" id="heroListBtn" tabindex="0">+ Minha lista</button>
      </div>
    </div>
    <div class="hero-bottom-fade"></div>
  </section>

  <main id="catalog"></main>

  <!-- OVERLAY TIKTOK -->
  <div class="tiktok-player" id="tiktokPlayer">
    <button class="back-btn focusable" id="backBtn" tabindex="0">← Voltar</button>
    <button class="sound-btn focusable" id="soundBtn" tabindex="0">🔇 Som</button>
    <video class="bg-video" id="bgVideo" muted playsinline></video>
    <video class="main-video" id="mainVideo" muted playsinline autoplay></video>
    <div class="action-buttons">
      <button class="watch-btn focusable" id="watchNowBtn" tabindex="0">▶ Assistir agora</button>
      <button class="details-btn focusable" id="detailsBtn" tabindex="0">ℹ Ver detalhes</button>
    </div>
    <div class="info-panel">
      <h2 id="playerTitle"></h2>
      <p id="playerDesc"></p>
    </div>
  </div>

  <script src="./assets/app.js" data-page-type="series"></script>
</body>
</html>
