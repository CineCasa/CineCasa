<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="version" content="v32-nuclear-clear-20250502">
  <title>CineCasa - Streaming</title>
  <link rel="stylesheet" href="./assets/app.css?v=32">
  <script>
    // NUCLEAR CACHE CLEAR - v32
    (function() {
      const SW_VERSION = 'v32-nuclear-clear';
      const storedVersion = localStorage.getItem('sw_version');
      
      if (storedVersion !== SW_VERSION) {
        console.log('[NUCLEAR CLEAR] Nova versão detectada:', SW_VERSION);
        // Limpar todos os caches
        if ('caches' in window) {
          caches.keys().then(names => {
            names.forEach(name => caches.delete(name));
          });
        }
        // Limpar localStorage relacionado ao app
        const keysToKeep = ['user_id', 'session'];
        Object.keys(localStorage).forEach(key => {
          if (!keysToKeep.includes(key)) {
            localStorage.removeItem(key);
          }
        });
        // Limpar sessionStorage
        sessionStorage.clear();
        // Registrar nova versão
        localStorage.setItem('sw_version', SW_VERSION);
        localStorage.setItem('sw_updated', Date.now().toString());
        console.log('[NUCLEAR CLEAR] Cache limpo, recarregando...');
        // Forçar reload se necessário
        if (storedVersion) {
          window.location.reload(true);
        }
      }
    })();
  </script>
</head>
<body>
  <header class="top-header">
    <h1>CineCasa</h1>
  </header>
  <main id="catalog"></main>
  
  <!-- OVERLAY TIKTOK -->
  <div class="tiktok-player" id="tiktokPlayer">
    <button class="back-btn focusable" id="backBtn" tabindex="0">← Voltar</button>
    <button class="sound-btn focusable" id="soundBtn" tabindex="0">🔇 Som</button>
    <video class="bg-video" id="bgVideo" muted playsinline></video>
    <video class="main-video" id="mainVideo" muted playsinline autoplay></video>
    <div class="action-buttons">
      <button class="watch-btn focusable" id="watchNowBtn" tabindex="0">▶ Assistir agora</button>
      <button class="details-btn focusable" id="detailsBtn" tabindex="0">ℹ Ver detalhes</button>
    </div>
    <div class="info-panel">
      <h2 id="playerTitle"></h2>
      <p id="playerDesc"></p>
    </div>
  </div>
  
  <script src="./assets/app.js?v=32"></script>
</body>
</html>
